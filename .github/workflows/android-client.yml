name: Android client

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-client.yml"

permissions:
  contents: read

jobs:
  test:
    name: gradle test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Do not use android-actions/setup-android: it still runs
      # `sdkmanager tools`, and Google removed that package.
      # GitHub-hosted ubuntu-latest already has cmdline-tools.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        working-directory: mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle test --no-daemon
