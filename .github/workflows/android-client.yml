name: Android client

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-client.yml"

permissions:
  contents: read

jobs:
  test:
    name: gradle test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Do not install the retired `tools` package. setup-android@v3 defaults
      # to `sdkmanager tools`, which now fails: Failed to find package 'tools'.
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        working-directory: mobile/android
        run: gradle test --no-daemon
